name: Generate and Obfuscate Worker Script

# 触发条件：手动触发 + 「明文源吗」文件变动时触发
on:
  workflow_dispatch:
  push:
    paths: ['我的更新']
    branches: [main]  # 若你的主分支是 master，改为 master

# 关键：授予工作流推送权限（Fork 仓库必需）
permissions:
  contents: write

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 防止卡壳超时

    steps:
      # 步骤1：拉取仓库代码（保留凭证，用于后续推送）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 核心：保留授权凭证

      # 步骤2：安装 Node.js 18 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'  # 缓存依赖，加速下次运行

      # 步骤3：安装 JS 混淆工具
      - name: Install obfuscator
        run: npm install javascript-obfuscator --save-dev

      # 步骤4：执行混淆（核心逻辑，无改动）
      - name: Obfuscate JS file
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs');
          const path = require('path');

          // 配置文件名称（无需修改，与你的文件一致）
          const sourceFile = '我的更新';
          const outputFile = '我的更新-2.1';
          const sourcePath = path.join(process.cwd(), sourceFile);

          // 检查源文件是否存在
          if (!fs.existsSync(sourcePath)) {
            console.error(`❌ 未找到源文件：${sourcePath}`);
            process.exit(1);
          }

          // 检查源文件是否为空
          const originalCode = fs.readFileSync(sourcePath, 'utf8').trim();
          if (!originalCode) {
            console.error(`❌ 源文件 ${sourceFile} 为空`);
            process.exit(1);
          }

          // 混淆配置（保持原有规则，兼顾混淆强度和运行效率）
          const obfOptions = {
            compact: true,
            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayRotate: true,
            stringArrayShuffle: true,
            stringArrayWrappersCount: 2,
            renameGlobals: true,
            identifierNamesGenerator: 'mangled-shuffled',
            disableConsoleOutput: true,
            target: 'browser',
            splitStrings: true,
            splitStringsChunkLength: 1,
            unicodeEscapeSequence: true
          };

          // 执行混淆并写入文件
          const obfuscatedCode = JavaScriptObfuscator.obfuscate(originalCode, obfOptions).getObfuscatedCode();
          fs.writeFileSync(outputFile, obfuscatedCode, 'utf8');
          console.log(`✅ 混淆成功！输出文件：${outputFile}`);
          EOF
          node obfuscate.js

      # 步骤5：提交并推送混淆后的文件
      - name: Commit and push obfuscated file
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ '我的更新-2.1' }}"
          if git diff --staged --quiet; then
            echo "ℹ️ 无变化，无需提交"
          else
            git commit -m "自动混淆：更新 ${outputFile}"
            git push
          fi
