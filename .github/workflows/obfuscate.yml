name: Generate and Obfuscate Worker Script

# 触发条件：手动触发 + 明文源文件变更（仅main分支）
on:
  workflow_dispatch:
  push:
    paths:
      - '明文源吗'
    branches:
      - main

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest
    # 显式声明写入代码的权限（关键：解决默认权限不足问题）
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 仅拉取最新提交，加速执行

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 移除 cache: 'npm'（因为没有锁文件，自动缓存会报错）
          cache: ''  # 禁用 setup-node 的自动缓存

      - name: Cache obfuscator dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm  # npm 缓存目录
          # 调整缓存密钥：不依赖锁文件，用 Node 版本 + 系统标识（避免缺失锁文件报错）
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-obfuscator
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install JavaScript Obfuscator
        run: npm install javascript-obfuscator@4.10.0  # 锁定版本，避免兼容性问题
        continue-on-error: false  # 依赖安装失败直接终止

      - name: Validate source file existence
        run: |
          if [ ! -f "明文源吗" ]; then
            echo "❌ 错误：未找到源文件 '明文源吗'，请确保文件在仓库根目录"
            exit 1
          fi
          if [ ! -s "明文源吗" ]; then
            echo "❌ 错误：源文件 '明文源吗' 为空，请检查文件内容"
            exit 1
          fi
          echo "✅ 源文件验证通过"

      - name: Obfuscate JavaScript file
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs/promises');
          const path = require('path');

          const config = {
            sourceFile: '明文源吗',
            outputFile: '少年你相信光吗',
            cwd: process.cwd()
          };

          async function obfuscateCode() {
            try {
              console.log(`📥 读取源文件：${path.join(config.cwd, config.sourceFile)}`);
              const originalCode = await fs.readFile(config.sourceFile, 'utf8');

              if (!originalCode.trim()) throw new Error('源文件内容为空');
              console.log(`📝 源文件大小：${originalCode.length} 字符`);

              const obfuscationOptions = {
                compact: true,
                controlFlowFlattening: false,
                deadCodeInjection: false,
                stringArray: true,
                stringArrayEncoding: ['base64'],
                stringArrayThreshold: 1.0,
                stringArrayRotate: true,
                stringArrayShuffle: true,
                stringArrayWrappersCount: 2,
                stringArrayWrappersParametersMaxCount: 3,
                renameGlobals: true,
                identifierNamesGenerator: 'mangled-shuffled',
                target: 'browser',
                splitStrings: true,
                splitStringsChunkLength: 1,
                unicodeEscapeSequence: true,
                disableConsoleOutput: true,
                selfDefending: false,
                debugProtection: false
              };

              console.log('🔒 开始混淆代码...');
              const result = JavaScriptObfuscator.obfuscate(originalCode, obfuscationOptions);
              const obfuscatedCode = result.getObfuscatedCode();

              console.log(`📤 保存混淆文件：${path.join(config.cwd, config.outputFile)}`);
              await fs.writeFile(config.outputFile, obfuscatedCode, 'utf8');
              console.log(`✅ 混淆完成！目标文件大小：${obfuscatedCode.length} 字符`);

            } catch (error) {
              console.error('❌ 混淆失败：', error.message);
              process.exit(1);
            }
          }

          obfuscateCode();
          EOF

          node obfuscate.js

      - name: Commit and push obfuscated file
        run: |
          # 配置Git身份
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 添加并检查文件变更
          git add '少年你相信光吗'
          if git diff --staged --quiet; then
            echo "ℹ️  无变更：混淆文件与现有版本一致"
            exit 0
          fi

          # 提交变更
          git commit -m "feat: 自动混淆Worker脚本 [$(date +'%Y-%m-%d %H:%M:%S')]"

          # 使用GITHUB_TOKEN推送（已配置仓库读写权限）
          git push origin ${{ github.ref }}

          echo "✅ 混淆文件提交成功！"

      - name: Cleanup temporary files
        if: always()  # 无论前序步骤是否成功，均清理临时文件
        run: |
          rm -f obfuscate.js
          echo "🧹 临时文件清理完成"
